name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK уже предустановлен на раннерах GitHub —
      # недостающие компоненты Gradle скачает сам.

      - name: Права на запуск gradlew
        run: chmod +x gradlew

      - name: Собрать APK (debug)
        run: ./gradlew assembleDebug --no-daemon

      - name: Положить APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
